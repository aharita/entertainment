<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ranked — Books, Movies, Games, TV, Anime</title>
<meta name="description" content="Books, movies, games, TV series and anime ranked by a volume-weighted score that blends three audience rating sites each, split into Modern, Classics and Current.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ECEAF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15131F" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://aharita.github.io/entertainment/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ranked">
<meta property="og:title" content="Ranked — Books, Movies, Games, TV, Anime">
<meta property="og:description" content="Ranked by audiences: a weighted score blending three rating sites per medium, split into Modern, Classics and Current.">
<meta property="og:url" content="https://aharita.github.io/entertainment/">
<meta property="og:image" content="https://aharita.github.io/entertainment/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Ranked, with the top book, movie, game, TV series and anime covers">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEAF2; --surface:#F8F7FB; --sunk:#E2DFEA; --ink:#1C1930; --muted:#5E5974; --line:#D2CEDD;
  --accent:#4733C8; --accent-soft:#E3DEFA; --saved:#B4235A; --gold:#8A6400; --gold-soft:#F6EBCB;
  --s1:#8A5A2B; --s2:#1F7A8C; --s3:#C9620A;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15131F; --surface:#1E1B2C; --sunk:#100E18; --ink:#ECE9F6; --muted:#A39DBA; --line:#322E45;
    --accent:#A99CFF; --accent-soft:#2D2652; --saved:#F27AA7; --gold:#E9C46A; --gold-soft:#3A3018;
    --s1:#D9AE7E; --s2:#6CC6DA; --s3:#F5A04F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15131F; --surface:#1E1B2C; --sunk:#100E18; --ink:#ECE9F6; --muted:#A39DBA; --line:#322E45;
  --accent:#A99CFF; --accent-soft:#2D2652; --saved:#F27AA7; --gold:#E9C46A; --gold-soft:#3A3018;
  --s1:#D9AE7E; --s2:#6CC6DA; --s3:#F5A04F;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 180px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

.top{padding:calc(env(safe-area-inset-top,0px) + 14px) 0 10px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0;flex-wrap:wrap}
.logo{font:700 32px/1 var(--serif);letter-spacing:-.03em}
.brand .sub{color:var(--muted);font-size:14px}
.lede{margin:0;font-size:13px;color:var(--muted);text-align:right}
.lede a{font-weight:600}

.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding:1px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;white-space:nowrap;appearance:none;border:1px solid var(--line);background:var(--surface);padding:9px 18px;border-radius:999px;font:600 15px/1 var(--sans);color:var(--muted);cursor:pointer}
.tab:hover{color:var(--ink);border-color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0}
.row0{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#filters{margin-top:10px}
#filters[hidden]{display:none}
.ftoggle{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.ftoggle svg{width:15px;height:15px}
.ftoggle:hover,.ftoggle[aria-expanded="true"]{color:var(--ink);border-color:var(--muted)}
.ftoggle b{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--surface);font-size:11px;line-height:18px;text-align:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.new{color:var(--accent);font-weight:700}
.seg button .n{font-weight:500;opacity:.75;margin-left:4px;font-size:12px}
.seg{border:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 1px var(--accent-soft)}
.seg button:not([aria-pressed="true"]):hover{color:var(--ink)}
.era-note{font-size:13px;color:var(--muted)}
.row1{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.row1.nogenre{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.field{position:relative}
.field input,.field select{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.field input{padding-left:36px}
.field svg{position:absolute;left:11px;top:12px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.pill{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.saved[aria-pressed="true"]{background:var(--saved);border-color:var(--saved);color:#fff}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.decades{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto}
.decades::-webkit-scrollbar{display:none}

.status{display:flex;justify-content:space-between;gap:12px 20px;align-items:baseline;padding:22px 0 10px;flex-wrap:wrap}
.status h2{font:600 26px/1.15 var(--serif);margin:0;letter-spacing:-.01em}
.status p{margin:0;color:var(--muted);font-size:14px}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}

ol.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:52px 64px minmax(0,1fr) 216px 44px;gap:0 18px;align-items:start;padding:16px 4px;border-bottom:1px solid var(--line)}
.item>.num{grid-column:1;grid-row:1/span 2}.item>.cover{grid-column:2;grid-row:1/span 2}
.item>.head{grid-column:3;grid-row:1}.item>.body{grid-column:3;grid-row:2}
.item>.side{grid-column:4;grid-row:1/span 2}.item>.save{grid-column:5;grid-row:1/span 2}
.item>div{min-width:0}
.num{font:600 38px/1 var(--serif);letter-spacing:-.04em;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.num.top{color:var(--ink)}
.cover{width:64px;aspect-ratio:2/3;border-radius:4px;overflow:hidden;background:var(--sunk);box-shadow:0 1px 2px rgba(0,0,0,.12),0 4px 10px rgba(28,25,48,.12);display:grid;place-items:center}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover span{font:600 11px/1.15 var(--serif);color:var(--muted);text-align:center;padding:6px;overflow:hidden}
.cover.stack{box-shadow:4px -4px 0 -1px var(--sunk),4px -4px 0 0 var(--line),0 4px 10px rgba(28,25,48,.12)}
.t{font:600 21px/1.2 var(--serif);margin:0;letter-spacing:-.005em}
.by{color:var(--muted);font-size:14px;margin-top:2px}
.meta{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta .tag{background:var(--sunk);border-radius:5px;padding:1px 7px;color:var(--ink)}
.meta .series{background:var(--accent);color:var(--surface);border-radius:5px;padding:1px 7px;font-weight:600}
.sum{margin:8px 0 0;font-size:14px;line-height:1.5;color:var(--ink);max-width:62ch}
.note{font-size:12.5px;color:var(--muted);margin-top:5px}
.srcs{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
.srcs a{font-size:12.5px;font-weight:600;text-underline-offset:3px}

.side{display:grid;gap:8px;font-variant-numeric:tabular-nums;padding-left:14px;border-left:1px solid var(--line)}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font:700 26px/1 var(--sans);color:var(--accent)}
.score span{font-size:11.5px;color:var(--muted);line-height:1.2}
.mini{display:grid;gap:2px;margin:0;font-size:12.5px}
.mini div{display:grid;grid-template-columns:minmax(0,1fr) 40px 42px;gap:6px;align-items:baseline}
.mini dt{color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini dt i{width:7px;height:7px;border-radius:2px;flex:none}
.mini dd{margin:0;text-align:right}
.mini dd.v{font-weight:700;color:var(--ink)}
.mini dd.c{color:var(--muted);font-size:11.5px}
.mini .on dt{color:var(--ink);font-weight:600}
.awards{display:flex;flex-wrap:wrap;gap:4px}
.aw{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;line-height:1.25;padding:3px 7px;border-radius:6px;background:var(--gold-soft);color:var(--ink)}
.aw svg{width:11px;height:11px;color:var(--gold);flex:none}
.aw.nom{background:var(--sunk);color:var(--muted)}
.aw.nom svg{color:var(--muted)}

details.members{grid-column:3/-1;grid-row:3;font-size:13px;margin-top:10px}
details.members summary{cursor:pointer;color:var(--accent);font-weight:600;width:max-content;list-style:none}
details.members summary::-webkit-details-marker{display:none}
details.members summary::before{content:"+ "}
details.members[open] summary::before{content:"– "}
.mwrap{overflow-x:auto;max-width:100%}
.mtable{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}
.mtable th,.mtable td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
.mtable th:first-child,.mtable td:first-child{text-align:left;white-space:normal}
.mtable th{font-weight:500;color:var(--muted);font-size:12px}
.mtable td.s{font-weight:700;color:var(--accent)}
.mtable .k{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.mtable .sub{color:var(--muted);font-size:11.5px}

.save{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.save svg{width:18px;height:18px}
.save[aria-pressed="true"]{color:var(--saved);border-color:var(--saved);background:color-mix(in srgb,var(--saved) 12%,var(--surface))}
.save[aria-pressed="true"] svg{fill:currentColor}

.empty{padding:40px 0;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:600 22px/1.2 var(--serif);margin-bottom:6px}

section.method{margin:56px 0 0;padding:28px 0 0;border-top:2px solid var(--ink);display:grid;grid-template-columns:1fr 1fr;gap:28px 40px}
section.method>div{min-width:0}
section.method .intro{grid-column:1/-1;margin:0 0 4px;color:var(--muted);max-width:75ch}
section.method h2{font:600 26px/1.15 var(--serif);margin:0 0 6px;grid-column:1/-1}
section.method h3{font:600 15px/1.3 var(--sans);margin:0 0 6px}
section.method p{margin:0 0 10px;color:var(--muted);font-size:14px;max-width:62ch}
.formula{font:500 13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);overflow-x:auto;white-space:pre}
footer{padding:28px 0 48px;color:var(--muted);font-size:13px}
.theme{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}

@media (max-width:980px){
  .item{grid-template-columns:44px 64px minmax(0,1fr) 200px 44px;gap:12px 16px}
}
@media (max-width:860px){
  .row1,.row1.nogenre{grid-template-columns:1fr 1fr}
  .row1 .field:first-child{grid-column:1/-1}
  .sep{display:none}
  section.method{grid-template-columns:1fr}
}
@media (max-width:640px){
  .item{grid-template-columns:26px 56px minmax(0,1fr) 40px;gap:0 12px;padding:16px 0}
  .num{font-size:22px;padding-top:2px}
  .cover{width:56px}
  .t{font-size:19px}
  .item>.num{grid-row:1}.item>.cover{grid-row:1}.item>.head{grid-row:1}
  .item>.save{grid-column:4;grid-row:1}
  .item>.body{grid-column:1/-1;grid-row:2;margin-top:4px}
  .sum{max-width:none;font-size:15px}
  .item>.side{grid-column:1/-1;grid-row:3;margin-top:12px;border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px;grid-template-columns:auto minmax(0,1fr);gap:8px 22px;align-items:center}
  .item .score{flex-direction:column;gap:2px}
  .item .awards{grid-column:1/-1}
  .item details.members{grid-column:1/-1;grid-row:4;margin-top:12px}
  .meta{gap:6px 8px}
  .meta .tag{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .srcs{gap:16px;margin-top:8px}
  .srcs a{font-size:14px;padding:4px 0}
  details.members summary{font-size:14px;padding:6px 0}
  .mtable .c{display:none}
  .mtable thead{display:none}
  .mtable,.mtable tbody{display:block;width:100%}
  .mtable tr{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
  .mtable td{padding:0;border:0;text-align:left}
  .mtable td:first-child{flex:1 1 calc(100% - 80px);order:1;font-size:14px}
  .mtable td.s{order:2;flex:none;margin-left:auto;font-size:15px}
  .mtable td[data-l]{order:3;font-size:12.5px;color:var(--muted)}
  .mtable td[data-l]::before{content:attr(data-l) " ";color:var(--muted)}
  .mtable td[data-l]{color:var(--ink)}
  .tabs{gap:4px}
  .tab{flex:1 1 auto;padding:8px 6px;font-size:13px;text-align:center}
  .controls{position:static}
  .lede{text-align:left}
  .logo{font-size:28px}
}
@media (max-width:480px){
  .wrap{padding:0 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap topbar">
    <div class="brand"><span class="logo">Ranked</span><span class="sub" id="sub"></span></div>
    <button class="theme" id="theme" type="button" aria-label="Switch colour theme">Theme</button>
  </div>
</header>

<div class="controls" role="search">
  <div class="wrap">
    <nav class="tabs" role="tablist" aria-label="Medium" id="tabs">
      <button class="tab" role="tab" data-m="books" aria-selected="true">Books</button>
      <button class="tab" role="tab" data-m="movies" aria-selected="false">Movies</button>
      <button class="tab" role="tab" data-m="games" aria-selected="false">Games</button>
      <button class="tab" role="tab" data-m="tv" aria-selected="false">TV Series</button>
      <button class="tab" role="tab" data-m="anime" aria-selected="false">Anime</button>
    </nav>
    <div class="row0">
      <div class="seg" role="group" aria-label="Era">
        <button type="button" data-e="M" aria-pressed="true">Modern</button>
        <button type="button" data-e="C" aria-pressed="false">Classics</button>
        <button type="button" data-e="N" aria-pressed="false">Current</button>
      </div>
      <span class="era-note" id="eraNote"></span>
      <button class="ftoggle" id="ftoggle" type="button" aria-expanded="false" aria-controls="filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search &amp; filters</span><b id="fcount" hidden></b></button>
    </div>
    <div id="filters" hidden>
    <div class="row1" id="row1">
      <div class="field">
        <label class="sr" for="q">Search</label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search title, creator, genre or plot" autocomplete="off">
      </div>
      <div class="field" id="genreField">
        <label class="sr" for="genre">Genre</label>
        <select id="genre"></select>
      </div>
      <div class="field">
        <label class="sr" for="sort">Sort by</label>
        <select id="sort"></select>
      </div>
    </div>
    <div class="row2">
      <div class="decades" id="decades" role="group" aria-label="Decade"></div>
      <span class="sep" aria-hidden="true"></span>
      <button class="pill" id="fAw" type="button" aria-pressed="false">Has awards</button>
      <button class="pill" id="fSeries" type="button" aria-pressed="false">Series only</button>
      <button class="pill saved" id="fSaved" type="button" aria-pressed="false">My list (<span id="savedN">0</span>)</button>
    </div>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="status">
    <div>
      <h2 id="heading"></h2>
      <p id="count" aria-live="polite"></p>
    </div>
    <p class="lede" id="lede"></p>
  </div>
  <ol class="list" id="list"></ol>
  <div class="empty" id="empty" hidden><strong>Nothing matches those filters</strong>Try a broader genre or decade, or <button class="linkish" id="clear" type="button">clear all filters</button>.</div>
  <section class="method" id="method"></section>
  <footer id="foot"></footer>
</main>

<script src="ranking.js"></script>
<script>
const DATA={},FILES={};

/* ---------- Helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function fmt(n){if(n==null)return '';if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e4)return Math.round(n/1e3)+'k';if(n>=1e3)return (n/1e3).toFixed(1)+'k';return n.toLocaleString();}
const enc=s=>encodeURIComponent(s);
const heart='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>';
const trophy='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>';
const COLORS=['var(--s1)','var(--s2)','var(--s3)'];

/* ---------- State ---------- */
const st={m:'books',e:'M',q:'',g:'',sort:'rank',dec:'',saved:false,series:false,aw:false};
function fromHash(){const h=location.hash.slice(1).split('/');if(!CFG[h[0]])return false;st.m=h[0];st.e=h[1]==='classics'?'C':h[1]==='current'?'N':'M';return true;}
try{fromHash();}catch(e){}
let push=false; // next render adds a history entry instead of replacing the current one

const KEY='ranked.saved';
let saved=new Set();
try{saved=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));}catch(e){}
const sk=x=>st.m+'|'+x.t;
function persist(){try{localStorage.setItem(KEY,JSON.stringify([...saved]));}catch(e){}updSaved();}
function updSaved(){document.getElementById('savedN').textContent=[...saved].filter(k=>k.startsWith(st.m+'|')).length;}

(function(){
  const root=document.documentElement;let t=null;
  try{t=localStorage.getItem('ranked.theme');}catch(e){}
  if(t)root.dataset.theme=t;
  document.getElementById('theme').addEventListener('click',()=>{
    const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme=dark?'light':'dark';
    try{localStorage.setItem('ranked.theme',root.dataset.theme);}catch(e){}
  });
})();

/* ---------- Rendering pieces ---------- */
function mini(x){
  const src=CFG[st.m].src,avg=false;
  return `<dl class="mini">${src.map((p,i)=>{const v=x.s[p.k];
    return `<div class="${st.sort===p.k?'on':''}"><dt><i style="background:${COLORS[i]}"></i>${p.l}</dt>${v?`<dd class="v">${avg&&p.k!=='rt'&&p.k!=='steam'?v[0].toFixed(2):p.f(v[0])}</dd><dd class="c">${fmt(v[1])}</dd>`:'<dd class="v">—</dd><dd class="c"></dd>'}</div>`;}).join('')}</dl>`;
}
function awardsHtml(x){
  if(!x.aw||!x.aw.length)return '';
  let list=x.aw;
  if(x.books){const n=list.length;return `<div class="awards"><span class="aw">${trophy}${n} award${n>1?'s':''} across the series</span></div>`;}
  return `<div class="awards">${list.map(a=>{const nom=/nominee|nomination/i.test(a)&&!/^Won/.test(a);return `<span class="aw${nom?' nom':''}">${trophy}${esc(a)}</span>`;}).join('')}</div>`;
}
function coverHtml(x){
  const key=x.books?((x.books.find(b=>b.no==='#1'&&b.img)||x.books.find(b=>b.img)||{}).img||x.img):x.img;
  const img=key?`<img src="covers/${key}.webp" alt="" width="64" height="96" decoding="async" loading="lazy">`:`<span>${esc(x.t)}</span>`;
  return `<div class="cover${x.books?' stack':''}" aria-hidden="true">${img}</div>`;
}
function membersHtml(x){
  const src=CFG[st.m].src;
  const cell=(b,p)=>b.s[p.k]?`${p.f(b.s[p.k][0])}<span class="c sub"> ${fmt(b.s[p.k][1])}</span>`:'—';
  return `<details class="members"><summary>${{books:'Books',movies:'Films',games:'Games',anime:'Seasons'}[st.m]} in this series (${x.books.length})</summary><div class="mwrap"><table class="mtable">
    <thead><tr><th>Title</th>${src.map((p,i)=>`<th><i class="k" style="background:${COLORS[i]}"></i>${p.l}</th>`).join('')}<th>Score</th></tr></thead>
    <tbody>${x.books.map(b=>`<tr><td>${b.no?`<span class="sub">${esc(b.no).replace('New','<b class="new">New</b>')}</span> `:''}${esc(b.t)}${b.aw?`<br><span class="sub">${b.aw.map(esc).join(' · ')}</span>`:''}</td>${src.map(p=>`<td data-l="${p.l.replace(' audience','').replace(' users','')}">${cell(b,p)}</td>`).join('')}<td class="s">${b===x.best?'★ ':''}${b.score.toFixed(2)}</td></tr>`).join('')}</tbody></table></div></details>`;
}
function item(x,label){
  const c=CFG[st.m],on=saved.has(sk(x));
  const term=enc((x.books?x.t:x.t)+(st.m==='books'?' '+x.by:''));
  const yr=x.books?(x.y0===x.y?x.y:`${x.y0}–${x.y}`):x.y;
  return `<li class="item">
    <div class="num${label<=10?' top':''}" aria-label="Rank ${label}">${label}</div>
    ${coverHtml(x)}
    <div class="head">
      <h3 class="t">${esc(x.t)}</h3>
      <div class="by">${esc(x.by||'')}</div>
      <div class="meta">${x.books?`<span class="series">Series · ${x.books.length} ${{books:'books',movies:'films',games:'games',anime:'seasons'}[st.m]}</span>`:''}${x.g?`<span class="tag">${esc(x.g)}</span>`:''}<span>${yr}</span></div>
      </div>
    <div class="body">
      ${x.sum?`<p class="sum">${esc(x.sum)}</p>`:''}
      ${x.books?'':`<div class="srcs">${c.src.map(p=>`<a href="${pageUrl(p.k,x.ids)||p.url(st.m==='books'&&p.k==='aud'&&x.audQ?enc(x.audQ):term)}" target="_blank" rel="noopener">${p.l.replace(' audience','').replace(' users','')}</a>`).join('')}</div>`}
    </div>
    <div class="side"><div class="score" title="Weighted score"><b>${x.score.toFixed(2)}</b><span>${x.books?'best entry':'weighted score'}</span></div>${mini(x)}${awardsHtml(x)}</div>
    <button class="save" type="button" data-t="${esc(x.t)}" aria-pressed="${on}" aria-label="${on?'Remove from':'Add to'} my list: ${esc(x.t)}">${heart}</button>
    ${x.books?membersHtml(x):''}
  </li>`;
}

/* ---------- Controls per medium ---------- */
const FAMILIES={
  books:[['LitRPG',/litrpg/i],['Fantasy',/fantasy/i],['Sci-fi & dystopian',/science fiction|dystopian/i],['Thriller & mystery',/thriller|mystery|horror/i],['Historical fiction',/historical fiction/i],['Romance',/romance/i],['Memoir & biography',/memoir|biography/i],['History & true crime',/history|true crime|social science/i],['Self-help & money',/personal development|finance|business|philosophy/i],['Science & health',/science|health|psychology/i],['Fiction',/fiction|adventure|classic/i]],
  tv:[['Animation',/animation/i],['Documentary',/documentary/i],['Sci-fi & fantasy',/sci-fi|fantasy|horror/i],['Crime & thriller',/crime|thriller|mystery/i],['Comedy',/comedy/i],['Drama',/drama|history|war|western|sport|biography|romance|adventure|action/i]],
  anime:[['Films',/film/i],['Sports',/sports/i],['Mecha & sci-fi',/mecha|sci-fi/i],['Mystery & psychological',/mystery|psychological|thriller|horror/i],['Romance',/romance/i],['Fantasy & adventure',/fantasy|adventure/i],['Action',/action/i],['Comedy & slice of life',/comedy|slice of life/i],['Drama',/drama/i]],
  movies:[['Animation',/animation/i],['Sci-fi & fantasy',/sci-fi|fantasy/i],['Crime & thriller',/crime|thriller|mystery|film-noir|horror/i],['Action & adventure',/action|adventure|war|western/i],['Comedy',/comedy|musical/i],['Drama',/drama|biography|romance|sport|family|music/i]]
};
function familyOf(x){const F=FAMILIES[st.m];if(!F)return '';const f=F.find(([,re])=>re.test(x.g||''));return f?f[0]:'Other';}
const SORTS=()=>{const s=CFG[st.m].src;return [['rank','Rank'],...s.map(p=>[p.k,p.l+' rating']),['most','Most rated on '+s[0].l],['spread','Biggest disagreement'],['year','Newest first'],['title','Title A–Z']];};
function setupControls(){
  const c=CFG[st.m],list=DATA[st.m][st.e];
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.m===st.m));
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.e===st.e));
  document.getElementById('eraNote').textContent=st.e==='C'?c.cutText:st.e==='N'?c.curText:`Modern: ${c.cut} onward`;
  document.getElementById('sub').textContent=c.sub;
  const books=DATA[st.m].M.length+DATA[st.m].C.length;
  document.getElementById('lede').innerHTML=`Ratings checked ${checkedText(st.m,true)} · <a href="#method">How it’s ranked</a>`;
  document.querySelectorAll('.seg button').forEach(b=>{b.innerHTML=({M:'Modern',C:'Classics',N:'Current'}[b.dataset.e])+`<span class="n">${DATA[st.m][b.dataset.e].length}</span>`;});
  const sortSel=document.getElementById('sort');sortSel.innerHTML=SORTS().map(([v,l])=>`<option value="${v}">Sort: ${l}</option>`).join('');sortSel.value=st.sort=SORTS().some(s=>s[0]===st.sort)?st.sort:'rank';
  const gf=document.getElementById('genreField'),gs=document.getElementById('genre');
  if(FAMILIES[st.m]){gf.hidden=false;document.getElementById('row1').classList.remove('nogenre');const cnt={};list.forEach(x=>{const f=familyOf(x);cnt[f]=(cnt[f]||0)+1;});gs.innerHTML='<option value="">All genres</option>'+Object.keys(cnt).sort().map(f=>`<option value="${esc(f)}">${esc(f)} (${cnt[f]})</option>`).join('');gs.value=st.g=cnt[st.g]?st.g:'';}
  else{gf.hidden=true;document.getElementById('row1').classList.add('nogenre');st.g='';}
  const decs=[...new Set(list.flatMap(x=>x.years).map(y=>y<1900?'pre':String(Math.floor(y/10)*10)))].sort((a,b)=>a==='pre'?-1:b==='pre'?1:b-a);
  const del=document.getElementById('decades');del.innerHTML=['',...decs].map(d=>`<button class="pill" type="button" data-d="${d}" aria-pressed="${d===st.dec}">${d===''?'All years':d==='pre'?'Before 1900':d+'s'}</button>`).join('');
  if(!decs.includes(st.dec))st.dec='';
  document.getElementById('fSeries').hidden=!list.some(x=>x.books);if(document.getElementById('fSeries').hidden)st.series=false;
  updSaved();
  methodHtml();
}
function methodHtml(){
  const c=CFG[st.m],s=c.src;
  document.getElementById('method').innerHTML=`<h2>How the ranking works</h2>
  <p class="intro">${c.lede} An independent list, not an official ranking from any of these sites.</p>
  <div><h3>1. Each site's rating, adjusted for volume</h3><p>Every rating is converted to a 5-point scale${s.some(p=>p.to5(10)!==10)?' (scores out of 10 are halved, percentages divided by 20)':''}. A rating backed by few people is pulled toward that site's typical score; at the threshold it counts half. Each site has its own typical score and threshold because they rate on different curves.</p>
  <div class="formula">adjusted = (n ÷ (n + m)) × rating + (m ÷ (n + m)) × typical

${s.map(p=>`${p.l.padEnd(18)} typical ${p.c.toFixed(2)}   m = ${p.m.toLocaleString()}`).join('\n')}</div></div>
  <div><h3>2. Blend the three</h3><p>Each adjusted rating is compared with its own site's typical score, and the differences are blended: ${s.map(p=>`${p.l} ${Math.round(p.w*100)}%`).join(', ')}. If a site has no rating, the others share its weight. The starting point (${c.base}) is set per tab so the best titles land just under 5; compare scores within a tab, not across books, films and games.</p>
  <div class="formula">Score = ${c.base} + ${s.map((p,i)=>`${p.w} × (${p.l.split(' ')[0]} − ${p.c})`).join('\n            + ')}</div></div>
  <div><h3>3. Modern, classics and current are ranked separately</h3><p>${c.cutText}. Current: ${(a=>a[0].toLowerCase()+a.slice(1))(FILES[st.m].current.about)}; these titles have had only a few months to collect ratings, so the volume adjustment holds them closer to typical scores and their places will move. A series with a new entry in that time is listed with all its entries and ranked by its best one, old or new. Older titles are rated by people looking back, often for school or out of curiosity, while new ones are rated in their first rush of fans. Ranking them apart compares like with like.</p></div>
  <div><h3>4. Series count once, by their best entry</h3><p>Titles are grouped only when they tell one continuing story with the same main characters, the kind you'd go through in order (The Lord of the Rings, The Last of Us). Franchises of standalone stories, such as Zelda, Mario, Silent Hill, Resident Evil or Dark Souls, stay as separate entries. A series sits in the list of its first entry and is ranked by its single best-scoring entry, so a weaker sequel never drags it down. Open the series to see every entry's numbers.</p></div>
  <div><h3>Awards</h3><p>${c.awards}</p></div>
  <div><h3>Caveats</h3><p>${c.caveat}</p></div>`;
  document.getElementById('foot').textContent=c.foot.replace('{date}',checkedText(st.m))+' Source links open the live page or a search, so numbers will drift.';
}

/* ---------- List ---------- */
const v5=(x,k)=>{const p=CFG[st.m].src.find(p=>p.k===k);return x.s[k]?p.to5(x.s[k][0]):-1;};
function sorter(s){
  const first=CFG[st.m].src[0].k;
  if(CFG[st.m].src.some(p=>p.k===s))return (a,b)=>v5(b,s)-v5(a,s)||a.rank-b.rank;
  return s==='most'?(a,b)=>(b.s[first]?.[1]??-1)-(a.s[first]?.[1]??-1)
    :s==='spread'?(a,b)=>b.spread-a.spread||a.rank-b.rank
    :s==='year'?(a,b)=>b.y-a.y||a.rank-b.rank
    :s==='title'?(a,b)=>a.t.localeCompare(b.t)
    :(a,b)=>a.rank-b.rank;
}
const matchDec=x=>!st.dec||x.years.some(y=>st.dec==='pre'?y<1900:String(Math.floor(y/10)*10)===st.dec);
const hay=x=>(x.t+' '+(x.by||'')+' '+(x.g||'')+' '+(x.sum||'')+' '+(x.books?x.books.map(b=>b.t).join(' '):'')).toLowerCase();
function render(){
  const list=DATA[st.m][st.e],qq=st.q.toLowerCase();
  const arr=list.filter(x=>(!qq||hay(x).includes(qq))&&(!st.g||familyOf(x)===st.g)&&matchDec(x)&&(!st.saved||saved.has(sk(x)))&&(!st.series||x.books)&&(!st.aw||(x.aw&&x.aw.length)));
  const local=new Map();
  if(st.dec)[...arr].sort((a,b)=>a.rank-b.rank).forEach((x,i)=>local.set(x,i+1));
  arr.sort(sorter(st.sort));
  document.getElementById('list').innerHTML=arr.map(x=>item(x,st.dec?local.get(x):x.rank)).join('');
  const lab={books:'books',movies:'movies',games:'games',tv:'TV series',anime:'anime'}[st.m];
  document.getElementById('heading').textContent=st.saved?'My list':`${{C:'Classic',N:'Current',M:'Modern'}[st.e]} ${lab}${st.dec?`, ${st.dec==='pre'?'before 1900':st.dec+'s'}`:', ranked'}`;
  document.getElementById('count').textContent=arr.length?`${arr.length} entr${arr.length===1?'y':'ies'}${st.dec?' · numbered within this decade':''}`:'';
  document.getElementById('empty').hidden=arr.length>0;
  document.querySelectorAll('#decades .pill').forEach(p=>p.setAttribute('aria-pressed',p.dataset.d===st.dec));
  document.getElementById('fSaved').setAttribute('aria-pressed',st.saved);
  document.getElementById('fSeries').setAttribute('aria-pressed',st.series);
  document.getElementById('fAw').setAttribute('aria-pressed',st.aw);
  {const n=fActive(),fc=document.getElementById('fcount');fc.hidden=!n;fc.textContent=n;}
  const want='#'+st.m+({C:'/classics',N:'/current'}[st.e]||'');
  if(location.hash!==want)try{history[push?'pushState':'replaceState'](null,'',want);}catch(e){}
  push=false;
}
function fActive(){return [st.q,st.g,st.dec,st.saved,st.series,st.aw,st.sort!=='rank'].filter(Boolean).length;}
function setFilters(open){const f=document.getElementById('filters'),b=document.getElementById('ftoggle');f.hidden=!open;b.setAttribute('aria-expanded',open);try{localStorage.setItem('ranked.filters',open?'1':'0');}catch(e){}}
document.getElementById('ftoggle').addEventListener('click',()=>{const open=document.getElementById('filters').hidden;setFilters(open);if(open)document.getElementById('q').focus({preventScroll:true});});
try{if(localStorage.getItem('ranked.filters')==='1')setFilters(true);}catch(e){}
function full(){if(!DATA[st.m])return;setupControls();render();}

function resetFilters(){Object.assign(st,{q:'',g:'',dec:'',sort:'rank',saved:false,series:false,aw:false});document.getElementById('q').value='';}
document.getElementById('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t||t.dataset.m===st.m)return;st.m=t.dataset.m;resetFilters();push=true;full();});
document.getElementById('tabs').addEventListener('keydown',e=>{if(!/Arrow(Left|Right)/.test(e.key))return;const ts=[...document.querySelectorAll('.tab')];let i=ts.findIndex(t=>t.dataset.m===st.m);i=(i+(e.key==='ArrowRight'?1:ts.length-1))%ts.length;ts[i].click();ts[i].focus();});
document.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.e===st.e)return;st.e=b.dataset.e;st.dec='';st.g='';push=true;full();});
// Back/Forward and edited or pasted links; non-route anchors like #method are left alone
function onNav(){const m=st.m,e=st.e;if(!fromHash()||(st.m===m&&st.e===e))return;if(st.m!==m)resetFilters();else{st.dec='';st.g='';}full();}
addEventListener('hashchange',onNav);addEventListener('popstate',onNav);
document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value.trim();render();});
document.getElementById('genre').addEventListener('change',e=>{st.g=e.target.value;render();});
document.getElementById('sort').addEventListener('change',e=>{st.sort=e.target.value;render();});
document.getElementById('decades').addEventListener('click',e=>{const p=e.target.closest('.pill');if(!p)return;st.dec=p.dataset.d;render();});
document.getElementById('fSaved').addEventListener('click',()=>{st.saved=!st.saved;render();});
document.getElementById('fSeries').addEventListener('click',()=>{st.series=!st.series;render();});
document.getElementById('fAw').addEventListener('click',()=>{st.aw=!st.aw;render();});
document.getElementById('clear').addEventListener('click',()=>{Object.assign(st,{q:'',g:'',dec:'',saved:false,series:false,aw:false});document.getElementById('q').value='';document.getElementById('genre').value='';render();});
document.querySelector('main').addEventListener('click',e=>{
  const s=e.target.closest('.save');if(!s)return;
  const k=st.m+'|'+s.dataset.t;saved.has(k)?saved.delete(k):saved.add(k);persist();
  const on=saved.has(k);s.setAttribute('aria-pressed',on);
  s.setAttribute('aria-label',`${on?'Remove from':'Add to'} my list: ${s.dataset.t}`);
  if(st.saved&&!on)render();
});
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
// "3 October 2026", or "3–25 October 2026" when ratings were read over several days
function checkedText(m,short){
  const [a,b]=checkedRange(FILES[m]).map(d=>d.split('-').map(Number));
  const mon=i=>short?MONTHS[i-1].slice(0,3):MONTHS[i-1];
  const one=d=>`${d[2]} ${mon(d[1])} ${d[0]}`;
  if(a.join()===b.join())return one(a);
  if(a[0]===b[0]&&a[1]===b[1])return `${a[2]}–${b[2]} ${mon(a[1])} ${a[0]}`;
  return `${one(a)} – ${one(b)}`;
}
Promise.all(Object.keys(CFG).map(m=>fetch(`data/${m}.json`).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(d=>{
  FILES[m]=d;const x=expand(d);for(const e in x)rankList(m,x[e]);DATA[m]=x;
}))).then(full,err=>{
  document.getElementById('list').innerHTML='';
  const em=document.getElementById('empty');em.hidden=false;em.textContent='The rankings couldn’t load. Check your connection and reload the page.';
  console.error(err);
});
</script>
</body>
</html>
